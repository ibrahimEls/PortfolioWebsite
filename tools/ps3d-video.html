<!DOCTYPE html><html><head><meta charset="utf-8">
<!--
  Frame grabber for the 3D explorer, used to record the search as a video.

  Serve the repo root and open  /tools/ps3d-video.html?n=<frames>
  with headless Chrome and --dump-dom. It steps the turn slider from 0 to
  49 while sweeping the camera 180 degrees, and writes each frame into the
  #frames element as base64 JPEG, one per line.

      chrome --headless=new --disable-gpu --use-gl=swiftshader \
             --enable-unsafe-swiftshader --virtual-time-budget=600000 \
             --window-size=1100,700 --dump-dom \
             "http://localhost:8000/tools/ps3d-video.html?n=120" > frames.html

  Then decode the lines to f%04d.jpg and encode, for example
      ffmpeg -framerate 24 -i f%04d.jpg -c:v libx264 -pix_fmt yuv420p \
             -crf 20 -movflags +faststart out.mp4
-->
<link rel="stylesheet" href="../assets/css/styles.css">
<style>
  html,body{margin:0;background:#fff}
  .ps3d{margin:0;padding:0;border:none;width:auto;transform:none;background:#fff}
  .ps3d__bar,.ps3d__controls,.ps3d__status,.ps3d figcaption{display:none!important}
  .ps3d__plot{width:1000px;height:560px;aspect-ratio:auto}
  .modebar{display:none!important}
  #frames{white-space:pre-wrap;word-break:break-all;font:8px monospace}
</style></head>
<body id="top"><div class="s-pagewrap"><div style="width:1000px">
<figure class="ps3d" id="ps3d" data-dir="../blog/haithem-assets/param-space" data-default="6">
  <div class="ps3d__bar">
    <button type="button" class="ps3d__play">Play</button>
    <input type="range" class="ps3d__slider" min="0" max="49" value="49">
    <span class="ps3d__turn"></span>
  </div>
  <div class="ps3d__plot"></div>
  <div class="ps3d__controls">
    <span class="ps3d__combo-wrap">Lagrangian
      <div class="combo ps3d__lagrangian"><button type="button" class="combo__btn"><span class="combo__name"></span><span class="combo__meta"></span></button><ul class="combo__list" hidden></ul></div></span>
    <span class="ps3d__combo-wrap">x<div class="combo combo--axis ps3d__x"><button type="button" class="combo__btn"><span class="combo__name"></span><span class="combo__meta"></span></button><ul class="combo__list" hidden></ul></div></span>
    <span class="ps3d__combo-wrap">y<div class="combo combo--axis ps3d__y"><button type="button" class="combo__btn"><span class="combo__name"></span><span class="combo__meta"></span></button><ul class="combo__list" hidden></ul></div></span>
    <span class="ps3d__combo-wrap">z<div class="combo combo--axis ps3d__z"><button type="button" class="combo__btn"><span class="combo__name"></span><span class="combo__meta"></span></button><ul class="combo__list" hidden></ul></div></span>
  </div>
  <p class="ps3d__status"></p>
  <figcaption>x</figcaption>
</figure></div>
<pre id="frames">pending</pre></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.27.0/plotly-gl3d.min.js"></script>
<script src="../blog/haithem-assets/param-space-3d.js"></script>
<script>
var NFRAMES = +((location.search.match(/n=(\d+)/) || [])[1] || 3);
var TURNS = 50, R = 1.85, ZEYE = 1.0, A0 = 45, SWEEP = 180;
function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
window.addEventListener('load', function () {
  var plot = document.querySelector('.ps3d__plot');
  var slider = document.querySelector('.ps3d__slider');
  (async function () {
    await sleep(6000);                       // dataset load + first draw
    await Plotly.relayout(plot, {paper_bgcolor:'#ffffff', showlegend:true,
      'font.color':'#2f3437', 'legend.font.color':'#2f3437',
      'legend.font.size':14});
    var out = [];
    for (var f = 0; f < NFRAMES; f++) {
      var p = NFRAMES === 1 ? 0 : f / (NFRAMES - 1);
      var turn = Math.round(p * (TURNS - 1));
      var a = (A0 + p * SWEEP) * Math.PI / 180;
      slider.value = turn;
      slider.dispatchEvent(new Event('input', {bubbles: true}));
      await sleep(90);
      // render() rebuilds the layout each turn, so the video's own styling
      // has to be re-applied after every redraw, not once at the start
      await Plotly.relayout(plot, {
        'scene.camera.eye': {x: R * Math.cos(a), y: R * Math.sin(a), z: ZEYE},
        paper_bgcolor: '#ffffff',
        'font.color': '#2f3437',
        'legend.font.color': '#2f3437',
        'legend.font.size': 14
      });
      await sleep(70);
      var url = await Plotly.toImage(plot,
        {format: 'jpeg', width: 1000, height: 560, scale: 1,
         setBackground: '#ffffff'});
      out.push(url.split(',')[1]);
    }
    document.getElementById('frames').textContent = out.join('\n');
    document.title = 'DONE ' + out.length;
  })();
});
</script></body></html>
